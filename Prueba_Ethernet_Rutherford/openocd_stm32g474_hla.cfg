# OpenOCD config for STM32G474QETx via ST-LINK/V2-V3 (SWD)
# Minimal self-contained config for HLA mode

adapter driver hla
hla_layout stlink
hla_vid_pid 0x0483 0x3748 0x0483 0x374b 0x0483 0x374d 0x0483 0x374e 0x0483 0x374f 0x0483 0x3753 0x0483 0x3754 0x0483 0x3757

transport select hla_swd
reset_config srst_only srst_nogate
adapter speed 4000
