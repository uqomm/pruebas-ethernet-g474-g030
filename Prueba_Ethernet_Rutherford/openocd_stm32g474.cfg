# OpenOCD inline config for STM32G474QETx via ST-LINK/V2-V3 (SWD)
# Self-contained — no external scripts required
# Works with OpenOCD 0.12+ (STMicroelectronics build)

# -------------------------------------------------------
# ST-LINK in HLA (High-Level Adapter) mode
# -------------------------------------------------------
adapter driver hla
hla_layout stlink
hla_vid_pid 0x0483 0x3748 0x0483 0x374b 0x0483 0x374d 0x0483 0x374e 0x0483 0x374f 0x0483 0x3753 0x0483 0x3754 0x0483 0x3757

# Transport: SWD
transport select hla_swd

# Reset: software system reset
reset_config srst_only srst_nogate

# -------------------------------------------------------
# Target: STM32G474QETx (Cortex-M4F)
# -------------------------------------------------------
set CHIPNAME stm32g474
set CPUTAPID 0x2ba01477
set WORKAREASIZE 0x8000

target create $CHIPNAME.cpu cortex_m -endian little -dap $CHIPNAME.cpu

# Flash bank (STM32G4 uses same flash controller as STM32L4)
flash bank $CHIPNAME.flash stm32l4x 0x08000000 0 0 0 $CHIPNAME.cpu

# Work area in SRAM
$CHIPNAME.cpu configure -work-area-phys 0x20000000 -work-area-size $WORKAREASIZE -work-area-backup 0

# Debug events
$CHIPNAME.cpu configure -event examine-end {
    # Enable Debug in SLEEP / STOP / STANDBY modes
    mmw 0xE0042004 0x00000007 0
}

# SWD clock speed
adapter speed 4000

# Init sequence: connect and halt
init
reset init
